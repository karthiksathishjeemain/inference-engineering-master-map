h3,
h4,
h5,
h6,

b,

.card {

}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        typeof data !== &quot;object&quot; ||

        ports.length !== 1

    #iem-platform .iem-flow {
      display: grid;
      grid-template-columns: repeat(9, minmax(64px, 1fr));
      gap: 4px;

      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;h3&gt;One scheduler iteration&lt;/h3&gt;&lt;div class=&quot;text-muted&quot;&gt;Prefill processes many prompt tokens; decode advances each active sequence by one token.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;iem-question-actions&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;iem-step-prev&quot;&gt;Previous&lt;/button&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;iem-step-next&quot;&gt;Next tick&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;iem-timeline&quot; id=&quot;iem-timeline&quot; aria-label=&quot;Continuous batching timeline&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;iem-legend&quot;&gt;&lt;span class=&quot;iem-swatch prefill&quot;&gt;&lt;/span&gt;Prefill &lt;span class=&quot;iem-swatch decode&quot;&gt;&lt;/span&gt;Decode &lt;span class=&quot;text-muted&quot; id=&quot;iem-tick-label&quot;&gt;Tick 1: Request A enters prefill.&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;iem-stats&quot;&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;TTFT estimate&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;iem-big-ttft&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;queue + prefill + first decode&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;TPOT estimate&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;iem-big-tpot&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;steady decode cadence&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Weight memory&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;iem-big-weights&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;parameters × bytes&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

      &lt;label class=&quot;form-label&quot;&gt;Prompt &lt;span id=&quot;iem-big-prompt-out&quot;&gt;1024 tokens&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;iem-big-prompt&quot; type=&quot;range&quot; min=&quot;128&quot; max=&quot;8192&quot; value=&quot;1024&quot; step=&quot;128&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Batch &lt;span id=&quot;iem-big-batch-out&quot;&gt;8&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;iem-big-batch&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;64&quot; value=&quot;8&quot; step=&quot;1&quot;&gt;&lt;/label&gt;
      &lt;label class=&quot;form-label&quot;&gt;Weight precision&lt;select class=&quot;form-select&quot; id=&quot;iem-big-precision&quot;&gt;&lt;option value=&quot;2&quot;&gt;BF16 / FP16&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;INT8 / FP8 storage&lt;/option&gt;&lt;option value=&quot;0.5&quot;&gt;INT4&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;iem-footnote text-small&quot;&gt;Estimates are intuition builders, not hardware benchmarks. They expose scaling direction and resource pressure.&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;iem-lesson-panel&quot; data-lesson-panel=&quot;1&quot;&gt;
      &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;COMPUTE&lt;/span&gt;&lt;h3&gt;From matrix multiplication to FLOPs&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;20–25 min&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-learning-copy&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Why it exists:&lt;/strong&gt; Transformer layers are dominated by matrix multiplications. Counting their operations gives a first estimate of work; counting their bytes reveals whether hardware can stay fed.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Intuition:&lt;/strong&gt; each output element is a dot product. Multiplying an M×K matrix by a K×N matrix produces M×N outputs, each requiring K multiplies and K additions: approximately 2MKN floating-point operations.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot;&gt;Rows M &lt;span id=&quot;m1-m-out&quot;&gt;16&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-m&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;128&quot; value=&quot;16&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Inner K &lt;span id=&quot;m1-k-out&quot;&gt;4096&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-k&quot; type=&quot;range&quot; min=&quot;256&quot; max=&quot;8192&quot; value=&quot;4096&quot; step=&quot;256&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Columns N &lt;span id=&quot;m1-n-out&quot;&gt;11008&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-n&quot; type=&quot;range&quot; min=&quot;512&quot; max=&quot;16384&quot; value=&quot;11008&quot; step=&quot;256&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Precision&lt;select class=&quot;form-select&quot; id=&quot;m1-matmul-bytes&quot;&gt;&lt;option value=&quot;2&quot;&gt;BF16 / FP16 · 2 B&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;FP8 / INT8 · 1 B&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;FP32 · 4 B&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-matmul&quot; aria-label=&quot;Matrix multiplication shapes&quot;&gt;
        &lt;div class=&quot;iem-matrix&quot;&gt;&lt;strong id=&quot;m1-a-shape&quot;&gt;A · 16×4096&lt;/strong&gt;&lt;span&gt;activations&lt;/span&gt;&lt;/div&gt;&lt;span&gt;×&lt;/span&gt;
        &lt;div class=&quot;iem-matrix alt&quot;&gt;&lt;strong id=&quot;m1-b-shape&quot;&gt;W · 4096×11008&lt;/strong&gt;&lt;span&gt;weights&lt;/span&gt;&lt;/div&gt;&lt;span&gt;=&lt;/span&gt;
        &lt;div class=&quot;iem-matrix result&quot;&gt;&lt;strong id=&quot;m1-c-shape&quot;&gt;C · 16×11008&lt;/strong&gt;&lt;span&gt;output&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-stats&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Work&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-flops&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;2 × M × K × N&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Minimum tensor bytes&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-matmul-memory&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;A + W + C once&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Arithmetic intensity&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-matmul-ai&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;FLOPs per byte&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;pre class=&quot;iem-code&quot;&gt;&lt;code&gt;# One linear projection: [tokens, hidden] @ [hidden, out]
y = x @ weight
# Approximate work
flops = 2 * tokens * hidden * out&lt;/code&gt;&lt;/pre&gt;
      &lt;div class=&quot;iem-triad&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Underneath&lt;/strong&gt;&lt;span&gt;The runtime chooses a GEMM kernel, tiles operands, and maps tiles to thread blocks and Tensor Cores.&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Performance implication&lt;/strong&gt;&lt;span&gt;Larger M reuses weights across more tokens, increasing arithmetic intensity.&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Common mistake&lt;/strong&gt;&lt;span&gt;High theoretical FLOPs do not help when the kernel waits for bytes or uses an unsupported shape.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;iem-lesson-panel&quot; data-lesson-panel=&quot;2&quot;&gt;
      &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;GPU EXECUTION&lt;/span&gt;&lt;h3&gt;How a tensor operation reaches the GPU&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;25–30 min&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-learning-copy&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Mental model:&lt;/strong&gt; a GPU is a factory of many streaming multiprocessors (SMs). A kernel launch sends a grid of thread blocks to SMs; warps execute instructions while the memory hierarchy tries to keep their operands nearby.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-chain&quot; aria-label=&quot;GPU execution chain&quot;&gt;&lt;span&gt;Python op&lt;/span&gt;&lt;span&gt;Runtime dispatch&lt;/span&gt;&lt;span&gt;Kernel launch&lt;/span&gt;&lt;span&gt;Thread blocks&lt;/span&gt;&lt;span&gt;Warps on SMs&lt;/span&gt;&lt;span&gt;Tensor Core math&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-sim-layout&quot;&gt;
        &lt;div class=&quot;iem-hierarchy&quot; aria-label=&quot;GPU memory hierarchy&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; data-gpu-part=&quot;registers&quot;&gt;&lt;span&gt;Registers&lt;/span&gt;&lt;span&gt;thread-private&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gpu-part=&quot;shared&quot;&gt;&lt;span&gt;Shared memory / L1&lt;/span&gt;&lt;span&gt;on-SM&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gpu-part=&quot;l2&quot;&gt;&lt;span&gt;L2 cache&lt;/span&gt;&lt;span&gt;chip-wide&lt;/span&gt;&lt;/button&gt;
          &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-gpu-part=&quot;hbm&quot;&gt;&lt;span&gt;HBM / VRAM&lt;/span&gt;&lt;span&gt;large, off-chip&lt;/span&gt;&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;
          &lt;div class=&quot;iem-node-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot; id=&quot;m1-gpu-scope&quot;&gt;PER THREAD&lt;/span&gt;&lt;h3 id=&quot;m1-gpu-title&quot;&gt;Registers&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot; id=&quot;m1-gpu-speed&quot;&gt;fastest&lt;/span&gt;&lt;/div&gt;
          &lt;p id=&quot;m1-gpu-copy&quot;&gt;Hold live values for each thread. Register pressure can reduce occupancy or spill data into much slower memory.&lt;/p&gt;
          &lt;div class=&quot;iem-triad&quot;&gt;
            &lt;div&gt;&lt;strong&gt;Capacity&lt;/strong&gt;&lt;span id=&quot;m1-gpu-capacity&quot;&gt;tiny&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;strong&gt;Inference use&lt;/strong&gt;&lt;span id=&quot;m1-gpu-use&quot;&gt;accumulators, fragments&lt;/span&gt;&lt;/div&gt;
            &lt;div&gt;&lt;strong&gt;Failure signal&lt;/strong&gt;&lt;span id=&quot;m1-gpu-fail&quot;&gt;spills, low occupancy&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-concept-grid&quot;&gt;
        &lt;div class=&quot;iem-concept&quot;&gt;&lt;strong&gt;Threads → warps&lt;/strong&gt;&lt;span&gt;Threads execute in groups. Branch divergence makes a warp serialize different paths.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;iem-concept&quot;&gt;&lt;strong&gt;Blocks → SMs&lt;/strong&gt;&lt;span&gt;A block stays on one SM. Registers and shared memory limit how many blocks can reside together.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;iem-concept&quot;&gt;&lt;strong&gt;Tensor Cores&lt;/strong&gt;&lt;span&gt;Specialized matrix units deliver high low-precision throughput when shapes and layouts match supported paths.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-equation&quot;&gt;&lt;span&gt;More occupancy&lt;/span&gt;&lt;span class=&quot;iem-eq-op&quot;&gt;≠&lt;/span&gt;&lt;span&gt;automatically faster&lt;/span&gt;&lt;span class=&quot;iem-eq-op&quot;&gt;·&lt;/span&gt;&lt;span&gt;enough active warps must hide latency without starving each warp of registers&lt;/span&gt;&lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;iem-lesson-panel&quot; data-lesson-panel=&quot;3&quot;&gt;
      &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;MEMORY &amp;amp; PRECISION&lt;/span&gt;&lt;h3&gt;Build a model-fit ledger&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;20–25 min&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-learning-copy&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Why it exists:&lt;/strong&gt; a model “fits” only after weights, KV cache, activations, temporary buffers, graphs, allocator fragmentation, and runtime reservations all fit at the same time.&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;First-principles rule:&lt;/strong&gt; weight bytes = parameters × bytes per parameter. BF16 stores each weight in 2 bytes, so a 7B model needs about 14 GB for weights before overhead.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot;&gt;Parameters &lt;span id=&quot;m1-params-out&quot;&gt;7B&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-params&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;80&quot; value=&quot;7&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Weight format&lt;select class=&quot;form-select&quot; id=&quot;m1-weight-bytes&quot;&gt;&lt;option value=&quot;2&quot;&gt;BF16 / FP16 · 2 B&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;FP8 / INT8 · 1 B&lt;/option&gt;&lt;option value=&quot;0.5&quot;&gt;INT4 · 0.5 B&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;FP32 · 4 B&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;GPU memory &lt;span id=&quot;m1-vram-out&quot;&gt;80 GB&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-vram&quot; type=&quot;range&quot; min=&quot;16&quot; max=&quot;192&quot; value=&quot;80&quot; step=&quot;8&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Runtime reserve &lt;span id=&quot;m1-reserve-out&quot;&gt;8 GB&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-reserve&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;32&quot; value=&quot;8&quot; step=&quot;1&quot;&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-stats&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Weight memory&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-weight-memory&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;parameters × bytes&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Minimum GPUs&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-min-gpus&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;weights + reserve only&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;KV / workload room&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-kv-room&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;after weights + reserve&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-memory-ledger&quot; id=&quot;m1-memory-ledger&quot; aria-label=&quot;Per GPU memory ledger&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-equation&quot;&gt;&lt;span id=&quot;m1-fit-equation&quot;&gt;14 GB weights + 8 GB runtime = 22 GB used&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-triad&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Precision&lt;/strong&gt;&lt;span&gt;Lower-bit formats reduce capacity and bandwidth pressure, but need supported kernels and acceptable quality.&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Fragmentation&lt;/strong&gt;&lt;span&gt;Reserved memory can exceed live tensors; inspect allocated versus reserved memory before declaring a leak.&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Production implication&lt;/strong&gt;&lt;span&gt;Unused memory is not waste when it is the safety margin for long prompts, bursts, and temporary buffers.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;

    &lt;article class=&quot;iem-lesson-panel&quot; data-lesson-panel=&quot;4&quot;&gt;
      &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;DATA MOVEMENT&lt;/span&gt;&lt;h3&gt;PCIe, NUMA, and network boundaries&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;15–20 min&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-learning-copy&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Mental model:&lt;/strong&gt; every boundary is a toll road. HBM feeds the GPU, PCIe connects host and device, an intra-node fabric connects GPUs, and the network connects nodes. The slowest unavoidable transfer can dominate the whole request.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;viz-controls&quot;&gt;
        &lt;label class=&quot;form-label&quot;&gt;Payload &lt;span id=&quot;m1-transfer-size-out&quot;&gt;4 GB&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-transfer-size&quot; type=&quot;range&quot; min=&quot;0.25&quot; max=&quot;32&quot; value=&quot;4&quot; step=&quot;0.25&quot;&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Link&lt;select class=&quot;form-select&quot; id=&quot;m1-link&quot;&gt;&lt;option value=&quot;32&quot;&gt;PCIe-class · 32 GB/s&lt;/option&gt;&lt;option value=&quot;100&quot;&gt;Fast GPU fabric · 100 GB/s&lt;/option&gt;&lt;option value=&quot;400&quot;&gt;High-bandwidth fabric · 400 GB/s&lt;/option&gt;&lt;option value=&quot;12.5&quot;&gt;100 Gb/s network · 12.5 GB/s&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
        &lt;label class=&quot;form-label&quot;&gt;Fixed latency &lt;span id=&quot;m1-latency-out&quot;&gt;10 µs&lt;/span&gt;&lt;input class=&quot;form-range&quot; id=&quot;m1-latency&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;1000&quot; value=&quot;10&quot; step=&quot;1&quot;&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;iem-stats&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Ideal transfer time&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-transfer-time&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;size ÷ bandwidth + latency&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;card viz-stat&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;Effective throughput&lt;/span&gt;&lt;span class=&quot;viz-stat-value&quot; id=&quot;m1-effective-bandwidth&quot;&gt;—&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;including fixed latency&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;iem-learning-copy&quot;&gt;
        &lt;p&gt;&lt;strong&gt;Why it exists:&lt;/strong&gt; arithmetic intensity connects algorithmic work to hardware capability. It is FLOPs divided by bytes moved. Compare it with the hardware ridge point: peak FLOPs divided by peak memory bandwidth.&lt;/p&gt;

      &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;PROJECT 1&lt;/span&gt;&lt;h3&gt;Trace and benchmark one Transformer forward pass&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;2–4 hours&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;iem-project-brief&quot;&gt;
        &lt;div&gt;&lt;strong&gt;Objective&lt;/strong&gt;&lt;span&gt;Run a small Transformer locally and produce a resource ledger from token IDs to logits.&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;Architecture&lt;/strong&gt;&lt;span&gt;Tokenizer → PyTorch model → profiler trace → latency/memory report. CPU is acceptable; a GPU adds kernel and memory observations.&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
