.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],

  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;iem-platform&quot;&gt;
  &lt;style&gt;
    #iem-platform {
      --iem-s1: var(--viz-series-1);
      --iem-s2: var(--viz-series-2);
      --iem-s3: var(--viz-series-3);
      --iem-s4: var(--viz-series-4);
      color: var(--foreground);
      width: 100%;
    }
    #iem-platform * { box-sizing: border-box; }
    #iem-platform .iem-topline,
    #iem-platform .iem-nav,
    #iem-platform .iem-section-head,
    #iem-platform .iem-kicker,
    #iem-platform .iem-meta,
    #iem-platform .iem-legend,
    #iem-platform .iem-node-head,
    #iem-platform .iem-control-head,
    #iem-platform .iem-bar-label,
    #iem-platform .iem-equation,
    #iem-platform .iem-project-head,
    #iem-platform .iem-question-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #iem-platform .iem-topline { justify-content: space-between; margin-bottom: 10px; }
    #iem-platform .iem-progress-shell {
      height: 7px;
      background: color-mix(in srgb, var(--muted) 70%, transparent);
      overflow: hidden;
      flex: 1 1 180px;
      border-radius: 999px;
    }
    #iem-platform .iem-progress-fill {
      height: 100%;
      width: 8%;
      background: var(--iem-s1);
      transition: width 220ms ease;
    }
    #iem-platform .iem-nav { margin-bottom: 18px; }
    #iem-platform .iem-view { display: none; }
    #iem-platform .iem-view.is-active { display: block; }
    #iem-platform .iem-section-head { justify-content: space-between; margin: 0 0 14px; }
    #iem-platform .iem-section-head h2,
    #iem-platform .iem-detail h3,
    #iem-platform .iem-card-title { margin: 0; }
    #iem-platform .iem-kicker { color: var(--muted-foreground); }
    #iem-platform .iem-map-layout {
      display: grid;
      grid-template-columns: minmax(220px, .8fr) minmax(300px, 1.4fr);
      gap: 22px;
      align-items: start;
    }
    #iem-platform .iem-layer-list { display: grid; gap: 4px; }
    #iem-platform .iem-layer {
      width: 100%;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      text-align: left;
      gap: 9px;
    }
    #iem-platform .iem-layer .iem-layer-num {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }
    #iem-platform .iem-layer .iem-layer-state { color: var(--muted-foreground); }
    #iem-platform .iem-detail { min-width: 0; }
    #iem-platform .iem-path {
      display: grid;
      grid-template-columns: repeat(8, minmax(64px, 1fr));
      align-items: stretch;
      gap: 3px;
      margin: 14px 0 18px;
    }
    #iem-platform .iem-path-step {
      position: relative;
      min-height: 60px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px 5px;
      background: color-mix(in srgb, var(--iem-s1) 9%, transparent);
      border-bottom: 2px solid color-mix(in srgb, var(--iem-s1) 48%, transparent);
    }
    #iem-platform .iem-path-step + .iem-path-step::before {
      content: &quot;›&quot;;
      position: absolute;
      left: -7px;
      color: var(--muted-foreground);
    }
    #iem-platform .iem-triad,
    #iem-platform .iem-stats,
    #iem-platform .iem-sim-layout,
    #iem-platform .iem-lab-layout,
    #iem-platform .iem-project-grid,
    #iem-platform .iem-metric-grid {
      display: grid;
      gap: 14px;
    }
    #iem-platform .iem-triad { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #iem-platform .iem-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 14px 0; }
    #iem-platform .iem-sim-layout { grid-template-columns: minmax(220px, .7fr) minmax(300px, 1.3fr); }
    #iem-platform .iem-lab-layout { grid-template-columns: minmax(220px, .75fr) minmax(300px, 1.25fr); }
    #iem-platform .iem-project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #iem-platform .iem-metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #iem-platform .iem-triad &gt; div,
    #iem-platform .iem-teach-step,
    #iem-platform .iem-metric,
    #iem-platform .iem-project {
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }
    #iem-platform .iem-triad strong,
    #iem-platform .iem-teach-step strong,
    #iem-platform .iem-metric strong,
    #iem-platform .iem-project strong { display: block; margin-bottom: 4px; font-weight: 500; }
    #iem-platform .iem-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    #iem-platform .iem-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--iem-s1) 11%, transparent);
    }
    #iem-platform .iem-flow {
      display: grid;
      grid-template-columns: repeat(9, minmax(64px, 1fr));
      gap: 4px;
      margin: 14px 0;
    }
    #iem-platform .iem-flow-node {
      min-height: 86px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      text-align: center;
      padding: 8px 4px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 76%, transparent);
      color: var(--card-foreground);
      border-radius: 8px;
      cursor: pointer;
    }
    #iem-platform .iem-flow-node:hover { background: var(--accent); color: var(--accent-foreground); }
    #iem-platform .iem-flow-node.is-active { background: var(--primary); color: var(--primary-foreground); }
    #iem-platform .iem-flow-node + .iem-flow-node::before {
      content: &quot;›&quot;;
      position: absolute;
      left: -7px;
      top: 34px;
      color: var(--muted-foreground);
    }
    #iem-platform .iem-flow-node svg { width: 18px; height: 18px; }
    #iem-platform .iem-node-detail { margin-bottom: 16px; }
    #iem-platform .iem-node-head { justify-content: space-between; margin-bottom: 10px; }
    #iem-platform .iem-timeline { margin: 18px 0; }
    #iem-platform .iem-time-axis {
      display: grid;
      grid-template-columns: 72px repeat(12, minmax(12px, 1fr));
      gap: 2px;
      align-items: stretch;
      margin-bottom: 4px;
    }
    #iem-platform .iem-time-label { display: flex; align-items: center; color: var(--muted-foreground); }
    #iem-platform .iem-slot {
      min-height: 28px;
      background: color-mix(in srgb, var(--muted) 54%, transparent);
      border-radius: 3px;
      transition: background 180ms ease, transform 180ms ease;
    }
    #iem-platform .iem-slot.prefill { background: color-mix(in srgb, var(--iem-s2) 50%, transparent); }
    #iem-platform .iem-slot.decode { background: color-mix(in srgb, var(--iem-s1) 58%, transparent); }
    #iem-platform .iem-slot.active { transform: translateY(-2px); outline: 2px solid var(--ring); }
    #iem-platform .iem-legend { color: var(--muted-foreground); }
    #iem-platform .iem-swatch { width: 12px; height: 12px; display: inline-block; border-radius: 3px; }
    #iem-platform .iem-swatch.prefill { background: var(--iem-s2); }
    #iem-platform .iem-swatch.decode { background: var(--iem-s1); }
    #iem-platform .iem-control-stack { display: grid; gap: 14px; }
    #iem-platform .iem-control-head { justify-content: space-between; }
    #iem-platform .iem-control-head output { font-variant-numeric: tabular-nums; }
    #iem-platform .iem-chart { min-width: 0; }
    #iem-platform .iem-bars { display: grid; gap: 12px; margin-top: 16px; }
    #iem-platform .iem-bar-label { justify-content: space-between; }
    #iem-platform .iem-bar-track {
      height: 16px;
      background: color-mix(in srgb, var(--muted) 65%, transparent);
      border-radius: 999px;
      overflow: hidden;
    }
    #iem-platform .iem-bar-fill {
      height: 100%;
      min-width: 2px;
      background: var(--iem-s1);
      border-radius: 999px;
      transition: width 220ms ease;
    }
    #iem-platform .iem-bar-fill.alt { background: var(--iem-s2); }
    #iem-platform .iem-bar-fill.third { background: var(--iem-s3); }
    #iem-platform .iem-equation {
      justify-content: center;
      margin: 16px 0;
      padding: 12px;
      background: color-mix(in srgb, var(--iem-s1) 8%, transparent);
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }
    #iem-platform .iem-eq-op { color: var(--muted-foreground); }
    #iem-platform .iem-canvas {
      min-height: 260px;
      display: grid;
      align-content: center;
    }
    #iem-platform .iem-memory-stack { display: flex; height: 210px; gap: 4px; align-items: end; }
    #iem-platform .iem-memory-segment {
      flex: 1;
      min-width: 0;
      display: grid;
      place-items: end center;
      padding: 8px 3px;
      background: color-mix(in srgb, var(--iem-s1) 38%, transparent);

      border-radius: 6px 6px 0 0;
      transition: height 220ms ease;

    #iem-platform .iem-memory-segment.weights { background: color-mix(in srgb, var(--iem-s2) 50%, transparent); }

    #iem-platform .iem-gpu-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
    #iem-platform .iem-gpu {

    #iem-platform .iem-signal-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    #iem-platform .iem-answer { display: none; margin-top: 14px; }
    #iem-platform .iem-answer.is-visible { display: block; }
    #iem-platform .iem-checklist { display: grid; gap: 7px; margin: 12px 0; }
    #iem-platform .iem-checklist label { display: flex; gap: 8px; align-items: start; }
    #iem-platform .iem-project { padding-top: 8px; padding-bottom: 8px; }
    #iem-platform .iem-project-head { justify-content: space-between; margin-bottom: 5px; }
    #iem-platform .iem-stage-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); display: inline-block; }
    #iem-platform .iem-stage-dot.current { background: var(--iem-s1); }
    #iem-platform .iem-stage-dot.future { background: var(--muted-foreground); }
    #iem-platform .iem-teaching-loop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
    #iem-platform .iem-teach-step { min-height: 68px; }
    #iem-platform .iem-mode-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
    #iem-platform .iem-footnote { margin-top: 18px; color: var(--muted-foreground); }
    #iem-platform .iem-footnote a { color: inherit; }
    #iem-platform .iem-hidden { display: none !important; }
    @media (max-width: 760px) {
      #iem-platform .iem-map-layout,
      #iem-platform .iem-sim-layout,
      #iem-platform .iem-lab-layout { grid-template-columns: 1fr; }
      #iem-platform .iem-flow { grid-template-columns: repeat(3, minmax(78px, 1fr)); }
      #iem-platform .iem-flow-node + .iem-flow-node::before { display: none; }
      #iem-platform .iem-path { grid-template-columns: repeat(4, minmax(70px, 1fr)); }
      #iem-platform .iem-path-step + .iem-path-step::before { display: none; }
      #iem-platform .iem-teaching-loop { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #iem-platform .iem-metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 470px) {
      #iem-platform .iem-triad,
      #iem-platform .iem-stats,
      #iem-platform .iem-project-grid,
      #iem-platform .iem-metric-grid { grid-template-columns: 1fr; }
      #iem-platform .iem-path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #iem-platform .iem-gpu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #iem-platform .iem-teaching-loop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #iem-platform .iem-time-axis { grid-template-columns: 54px repeat(12, minmax(8px, 1fr)); }
      #iem-platform .iem-slot { min-height: 22px; }

    @media (prefers-reduced-motion: reduce) {
      #iem-platform .iem-progress-fill,
      #iem-platform .iem-bar-fill,
      #iem-platform .iem-memory-segment,
      #iem-platform .iem-slot { transition: none; }
    }

        &lt;table class=&quot;iem-signal-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Signal&lt;/th&gt;&lt;th&gt;Observed&lt;/th&gt;&lt;th&gt;Question&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;lab-signals&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;

  &lt;section class=&quot;iem-view&quot; data-panel=&quot;curriculum&quot;&gt;
    &lt;div class=&quot;iem-section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Progressive build path&lt;/h2&gt;&lt;div class=&quot;text-muted&quot;&gt;Every project turns one conceptual layer into an operating system.&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;viz-badge&quot;&gt;12 PROJECTS + CAPSTONE&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;iem-teaching-loop&quot; aria-label=&quot;Default teaching loop&quot;&gt;
      &lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;1 · Why&lt;/strong&gt;Need and intuition&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;2 · See&lt;/strong&gt;Visual + numbers&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;3 · Formalize&lt;/strong&gt;Math + tensors&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;4 · Build&lt;/strong&gt;Code + runtime&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;5 · Execute&lt;/strong&gt;Kernels + hardware&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;6 · Measure&lt;/strong&gt;Latency + throughput&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;7 · Break&lt;/strong&gt;Mistakes + debugging&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;8 · Optimize&lt;/strong&gt;Trade-offs&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;9 · Produce&lt;/strong&gt;Serving implications&lt;/div&gt;&lt;div class=&quot;iem-teach-step&quot;&gt;&lt;strong&gt;10 · Prove&lt;/strong&gt;Exercise + interview&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;iem-project-grid&quot; id=&quot;iem-project-grid&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;margin-top:14px&quot;&gt;&lt;div class=&quot;iem-project-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;CAPSTONE&lt;/span&gt;&lt;h3&gt;Design a production inference platform&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;Senior-level review&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Choose model placement, parallelism, batching, KV policy, quantization, replicas, load balancing, autoscaling, observability, rollouts, and failure handling under a concrete traffic, latency, hardware, and budget envelope.&lt;/p&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; id=&quot;iem-capstone&quot;&gt;Open capstone brief&lt;/button&gt;&lt;div id=&quot;iem-capstone-brief&quot; class=&quot;iem-answer&quot;&gt;&lt;div class=&quot;iem-triad&quot;&gt;&lt;div&gt;&lt;strong&gt;Workload&lt;/strong&gt;70B model; 1,800 input / 320 output tokens median; 45 requests/s peak.&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Hardware&lt;/strong&gt;16 × 80 GB GPUs; two 8-GPU nodes; fast intra-node, slower inter-node fabric.&lt;/div&gt;&lt;div&gt;&lt;strong&gt;SLO + budget&lt;/strong&gt;p95 TTFT ≤ 900 ms; p95 TPOT ≤ 45 ms; no more than 16 GPUs.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;iem-footnote text-small&quot;&gt;Current framework note (verified Aug 2026): vLLM documents continuous batching, prefix caching, multiple parallelism modes and disaggregated prefill/decode; TensorRT-LLM documents in-flight batching, paged KV management and overlap scheduling; Hugging Face marks TGI as maintenance mode. Established principles in the map do not depend on any one engine.&lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;iem-platform&#x27;);
  if (!root) return;
  const iemOne = (s, n = root) =&gt; n.querySelector(s);
  const iemAll = (s, n = root) =&gt; Array.from(n.querySelectorAll(s));
  const clamp = (v, lo, hi) =&gt; Math.max(lo, Math.min(hi, v));
  const fmtBytes = (bytes) =&gt; {
    const units = [&#x27;B&#x27;,&#x27;KB&#x27;,&#x27;MB&#x27;,&#x27;GB&#x27;,&#x27;TB&#x27;]; let v = bytes; let i = 0;
    while (v &gt;= 1000 &amp;&amp; i &lt; units.length - 1) { v /= 1000; i++; }
    return `${v &gt;= 100 ? v.toFixed(0) : v &gt;= 10 ? v.toFixed(1) : v.toFixed(2)} ${units[i]}`;
  };
  const fmt = (v, digits = 1) =&gt; Number(v).toLocaleString(undefined, {maximumFractionDigits: digits});

  const layers = [
    {name:&#x27;Foundations&#x27;, difficulty:&#x27;Foundation&#x27;, why:&#x27;The resource model underneath every inference decision: compute, memory, movement, latency, and concurrency.&#x27;, prereq:&#x27;Python, tensors, basic systems&#x27;, question:&#x27;Where do time and bytes go?&#x27;, unlocks:&#x27;Transformer execution&#x27;, topics:[&#x27;GPU/CPU&#x27;,&#x27;FLOPs&#x27;,&#x27;bandwidth&#x27;,&#x27;latency&#x27;,&#x27;PCIe&#x27;,&#x27;NUMA&#x27;,&#x27;precision&#x27;]},
    {name:&#x27;Neural inference&#x27;, difficulty:&#x27;Foundation&#x27;, why:&#x27;Turns a model definition into a forward pass, logits, and an autoregressive loop.&#x27;, prereq:&#x27;Foundations + linear algebra&#x27;, question:&#x27;What computation predicts one token?&#x27;, unlocks:&#x27;Prefill and decode&#x27;, topics:[&#x27;forward pass&#x27;,&#x27;attention&#x27;,&#x27;MLP&#x27;,&#x27;logits&#x27;,&#x27;softmax&#x27;,&#x27;tokenization&#x27;]},
    {name:&#x27;LLM internals&#x27;, difficulty:&#x27;Core&#x27;, why:&#x27;Separates prompt processing from token generation and exposes their different performance regimes.&#x27;, prereq:&#x27;Transformer forward pass&#x27;, question:&#x27;Why do prefill and decode behave differently?&#x27;, unlocks:&#x27;KV engineering + roofline&#x27;, topics:[&#x27;prefill&#x27;,&#x27;decode&#x27;,&#x27;KV cache&#x27;,&#x27;arithmetic intensity&#x27;,&#x27;roofline&#x27;]},
    {name:&#x27;Inference runtime&#x27;, difficulty:&#x27;Core&#x27;, why:&#x27;Maps tensor operations to kernels, graphs, allocators, compilers, and device execution.&#x27;, prereq:&#x27;GPU + LLM internals&#x27;, question:&#x27;How does an op become GPU work?&#x27;, unlocks:&#x27;Kernel optimization&#x27;, topics:[&#x27;loading&#x27;,&#x27;kernels&#x27;,&#x27;fusion&#x27;,&#x27;CUDA graphs&#x27;,&#x27;compilation&#x27;,&#x27;memory pools&#x27;]},
    {name:&#x27;Serving&#x27;, difficulty:&#x27;Core&#x27;, why:&#x27;Coordinates many independent users over a finite token and memory budget.&#x27;, prereq:&#x27;Runtime + latency metrics&#x27;, question:&#x27;Which request runs next?&#x27;, unlocks:&#x27;Schedulers + production SLOs&#x27;, topics:[&#x27;queues&#x27;,&#x27;continuous batching&#x27;,&#x27;streaming&#x27;,&#x27;backpressure&#x27;,&#x27;admission&#x27;]},
    {name:&#x27;Parallelism&#x27;, difficulty:&#x27;Advanced&#x27;, why:&#x27;Splits model work across devices when one accelerator is insufficient or too slow.&#x27;, prereq:&#x27;Tensor shapes + collectives&#x27;, question:&#x27;What is split, and what must communicate?&#x27;, unlocks:&#x27;Distributed inference&#x27;, topics:[&#x27;TP&#x27;,&#x27;PP&#x27;,&#x27;DP&#x27;,&#x27;EP&#x27;,&#x27;CP&#x27;,&#x27;all-reduce&#x27;,&#x27;all-gather&#x27;]},
    {name:&#x27;KV cache engineering&#x27;, difficulty:&#x27;Advanced&#x27;, why:&#x27;Makes autoregressive reuse practical while controlling fragmentation, eviction, and memory pressure.&#x27;, prereq:&#x27;Attention + serving&#x27;, question:&#x27;How is history stored and scheduled?&#x27;, unlocks:&#x27;Long context + prefix reuse&#x27;, topics:[&#x27;layout&#x27;,&#x27;pages&#x27;,&#x27;blocks&#x27;,&#x27;prefix cache&#x27;,&#x27;eviction&#x27;,&#x27;fragmentation&#x27;]},
    {name:&#x27;Quantization&#x27;, difficulty:&#x27;Advanced&#x27;, why:&#x27;Trades representation fidelity for lower memory traffic, smaller capacity needs, and supported low-precision compute.&#x27;, prereq:&#x27;Precision + kernels&#x27;, question:&#x27;Which tensors can lose bits safely?&#x27;, unlocks:&#x27;Cost/performance tuning&#x27;, topics:[&#x27;BF16&#x27;,&#x27;FP8&#x27;,&#x27;INT8&#x27;,&#x27;INT4&#x27;,&#x27;calibration&#x27;,&#x27;KV quantization&#x27;]},
    {name:&#x27;Advanced decoding&#x27;, difficulty:&#x27;Advanced&#x27;, why:&#x27;Changes how candidate tokens are produced and verified to reduce serial decode cost or control output.&#x27;, prereq:&#x27;Autoregressive decode&#x27;, question:&#x27;Can we accept more than one token per expensive step?&#x27;, unlocks:&#x27;Speculation + structured generation&#x27;, topics:[&#x27;sampling&#x27;,&#x27;beam&#x27;,&#x27;draft models&#x27;,&#x27;Medusa&#x27;,&#x27;rejection&#x27;,&#x27;acceptance&#x27;]},
    {name:&#x27;Distributed inference&#x27;, difficulty:&#x27;Expert&#x27;, why:&#x27;Combines topology, collectives, placement, and synchronization across GPUs and nodes.&#x27;, prereq:&#x27;Parallelism + networking&#x27;, question:&#x27;When does communication erase compute gains?&#x27;, unlocks:&#x27;Multi-node production&#x27;, topics:[&#x27;NVLink&#x27;,&#x27;PCIe&#x27;,&#x27;InfiniBand&#x27;,&#x27;Ethernet&#x27;,&#x27;topology&#x27;,&#x27;faults&#x27;]},
    {name:&#x27;Optimization&#x27;, difficulty:&#x27;Expert&#x27;, why:&#x27;Chooses the highest-leverage change after identifying the actual limiting resource.&#x27;, prereq:&#x27;Profiling across all layers&#x27;, question:&#x27;What is the bottleneck now?&#x27;, unlocks:&#x27;Reliable performance work&#x27;, topics:[&#x27;fusion&#x27;,&#x27;graphs&#x27;,&#x27;batching&#x27;,&#x27;caching&#x27;,&#x27;scheduling&#x27;,&#x27;memory&#x27;]},
    {name:&#x27;Production serving&#x27;, difficulty:&#x27;Expert&#x27;, why:&#x27;Maintains SLOs through variable load, releases, failures, and cost constraints.&#x27;, prereq:&#x27;Serving + distributed systems&#x27;, question:&#x27;How does performance remain reliable?&#x27;, unlocks:&#x27;Platform architecture&#x27;, topics:[&#x27;autoscaling&#x27;,&#x27;SLOs&#x27;,&#x27;p99&#x27;,&#x27;rollouts&#x27;,&#x27;observability&#x27;,&#x27;fault tolerance&#x27;]},
    {name:&#x27;Frameworks&#x27;, difficulty:&#x27;Applied&#x27;, why:&#x27;Connects principles to concrete engine architectures and their hardware, model, and operational trade-offs.&#x27;, prereq:&#x27;All prior layers&#x27;, question:&#x27;Which engine fits this workload?&#x27;, unlocks:&#x27;Informed deployment choices&#x27;, topics:[&#x27;vLLM&#x27;,&#x27;TensorRT-LLM&#x27;,&#x27;SGLang&#x27;,&#x27;TGI&#x27;,&#x27;llama.cpp&#x27;,&#x27;DeepSpeed&#x27;,&#x27;TorchInductor&#x27;]}
  ];

  const layerList = iemOne(&#x27;#iem-layer-list&#x27;);
  layers.forEach((l, i) =&gt; {
    const b = document.createElement(&#x27;button&#x27;);
    b.type = &#x27;button&#x27;; b.className = `btn iem-layer${i === 0 ? &#x27; is-selected&#x27; : &#x27;&#x27;}`; b.dataset.layer = i; b.setAttribute(&#x27;aria-pressed&#x27;, i === 0 ? &#x27;true&#x27; : &#x27;false&#x27;);
    b.innerHTML = `&lt;span class=&quot;iem-layer-num&quot;&gt;${String(i).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;${l.name}&lt;/span&gt;&lt;span class=&quot;iem-layer-state&quot;&gt;${i === 0 ? &#x27;●&#x27; : &#x27;○&#x27;}&lt;/span&gt;`;
    layerList.appendChild(b);
  });
  function showLayer(i) {
    const l = layers[i];
    iemAll(&#x27;.iem-layer&#x27;).forEach((b, j) =&gt; { b.classList.toggle(&#x27;is-selected&#x27;, j === i); b.setAttribute(&#x27;aria-pressed&#x27;, j === i ? &#x27;true&#x27;:&#x27;false&#x27;); });
    iemOne(&#x27;#iem-layer-number&#x27;).textContent = `LAYER ${i}`; iemOne(&#x27;#iem-layer-title&#x27;).textContent = l.name; iemOne(&#x27;#iem-layer-difficulty&#x27;).textContent = l.difficulty;
    iemOne(&#x27;#iem-layer-why&#x27;).textContent = l.why; iemOne(&#x27;#iem-layer-prereq&#x27;).textContent = l.prereq; iemOne(&#x27;#iem-layer-question&#x27;).textContent = l.question; iemOne(&#x27;#iem-layer-unlocks&#x27;).textContent = l.unlocks;
    iemOne(&#x27;#iem-layer-topics&#x27;).innerHTML = l.topics.map(t =&gt; `&lt;span class=&quot;iem-chip&quot;&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;);
    iemOne(&#x27;#iem-enter-module&#x27;).textContent = i &lt;= 1 ? &#x27;Enter the big picture&#x27; : `Preview ${l.name}`;
  }
  layerList.addEventListener(&#x27;click&#x27;, e =&gt; { const b = e.target.closest(&#x27;[data-layer]&#x27;); if (b) showLayer(+b.dataset.layer); });

  function switchView(name) {
    iemAll(&#x27;[data-view]&#x27;).forEach(b =&gt; { const on = b.dataset.view === name; b.classList.toggle(&#x27;btn-primary&#x27;, on); b.setAttribute(&#x27;aria-pressed&#x27;, on ? &#x27;true&#x27;:&#x27;false&#x27;); });
    iemAll(&#x27;[data-panel]&#x27;).forEach(p =&gt; p.classList.toggle(&#x27;is-active&#x27;, p.dataset.panel === name));
    if (name !== &#x27;map&#x27;) { iemOne(&#x27;#iem-progress-fill&#x27;).style.width = &#x27;15%&#x27;; iemOne(&#x27;#iem-progress-label&#x27;).textContent = &#x27;Module 1 in progress&#x27;; }
  }
  iemAll(&#x27;[data-view]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; switchView(b.dataset.view)));
  iemOne(&#x27;#iem-enter-module&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; switchView(&#x27;module&#x27;));

  const flowData = [
    {title:&#x27;Request&#x27;, icon:&#x27;send&#x27;, resource:&#x27;CPU · network&#x27;, why:&#x27;Defines prompt, sampling, limits, and deadline.&#x27;, watch:&#x27;arrival rate · payload · deadline&#x27;, fail:&#x27;bursts overwhelm admission&#x27;},
    {title:&#x27;Tokenizer&#x27;, icon:&#x27;binary&#x27;, resource:&#x27;CPU · memory&#x27;, why:&#x27;Converts text into model vocabulary IDs.&#x27;, watch:&#x27;tokens/s · prompt length&#x27;, fail:&#x27;CPU stalls GPU feed&#x27;},
    {title:&#x27;Queue&#x27;, icon:&#x27;list-ordered&#x27;, resource:&#x27;Host memory&#x27;, why:&#x27;Buffers demand until capacity is admitted.&#x27;, watch:&#x27;queue time · depth · age&#x27;, fail:&#x27;tail latency explodes&#x27;},
    {title:&#x27;Scheduler&#x27;, icon:&#x27;calendar-clock&#x27;, resource:&#x27;CPU · policy&#x27;, why:&#x27;Packs token work under compute and KV budgets.&#x27;, watch:&#x27;batch tokens · preemption&#x27;, fail:&#x27;head-of-line blocking&#x27;},
    {title:&#x27;Prefill&#x27;, icon:&#x27;layers&#x27;, resource:&#x27;GPU compute&#x27;, why:&#x27;Processes prompt tokens in parallel and creates KV state.&#x27;, watch:&#x27;TTFT · FLOPs · batch tokens&#x27;, fail:&#x27;long prompts monopolize steps&#x27;},
    {title:&#x27;KV cache&#x27;, icon:&#x27;database&#x27;, resource:&#x27;GPU memory&#x27;, why:&#x27;Stores K/V tensors so history is not recomputed.&#x27;, watch:&#x27;blocks · hit rate · fragmentation&#x27;, fail:&#x27;allocation or eviction thrash&#x27;},
    {title:&#x27;Decode&#x27;, icon:&#x27;repeat-2&#x27;, resource:&#x27;GPU bandwidth&#x27;, why:&#x27;Advances each sequence one autoregressive token.&#x27;, watch:&#x27;TPOT · active sequences&#x27;, fail:&#x27;weight reads dominate&#x27;},
    {title:&#x27;Stream&#x27;, icon:&#x27;radio&#x27;, resource:&#x27;CPU · network&#x27;, why:&#x27;Returns tokens before generation completes.&#x27;, watch:&#x27;flush delay · disconnects&#x27;, fail:&#x27;backpressure pins resources&#x27;},
    {title:&#x27;Observe&#x27;, icon:&#x27;activity&#x27;, resource:&#x27;Telemetry&#x27;, why:&#x27;Closes the loop between SLO symptoms and resources.&#x27;, watch:&#x27;p50/p95/p99 · traces&#x27;, fail:&#x27;averages hide tail pain&#x27;}
  ];
  const flow = iemOne(&#x27;#iem-flow&#x27;);
  flowData.forEach((n, i) =&gt; {
    const b = document.createElement(&#x27;button&#x27;); b.type=&#x27;button&#x27;; b.className=`iem-flow-node${i===0?&#x27; is-active&#x27;:&#x27;&#x27;}`; b.dataset.node=i; b.setAttribute(&#x27;aria-pressed&#x27;, i===0?&#x27;true&#x27;:&#x27;false&#x27;);
    b.innerHTML = `&lt;i data-lucide=&quot;${n.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;${n.title}&lt;/span&gt;`; flow.appendChild(b);
  });
  function showNode(i) { const n=flowData[i]; iemAll(&#x27;.iem-flow-node&#x27;).forEach((b,j)=&gt;{b.classList.toggle(&#x27;is-active&#x27;,j===i);b.setAttribute(&#x27;aria-pressed&#x27;,j===i?&#x27;true&#x27;:&#x27;false&#x27;);}); iemOne(&#x27;#iem-node-stage&#x27;).textContent=`STAGE ${i+1}`; iemOne(&#x27;#iem-node-title&#x27;).textContent=n.title; iemOne(&#x27;#iem-node-resource&#x27;).textContent=n.resource; iemOne(&#x27;#iem-node-why&#x27;).textContent=n.why; iemOne(&#x27;#iem-node-watch&#x27;).textContent=n.watch; iemOne(&#x27;#iem-node-fail&#x27;).textContent=n.fail; }
  flow.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;[data-node]&#x27;);if(b)showNode(+b.dataset.node);});

  const modeCopy = {
    Explorer:[&#x27;Why it exists&#x27;,&#x27;Watch&#x27;,&#x27;Typical failure&#x27;],
    Hardware:[&#x27;Dominant resource&#x27;,&#x27;Hardware counter&#x27;,&#x27;Hardware failure&#x27;],
    Code:[&#x27;Runtime object&#x27;,&#x27;Instrument here&#x27;,&#x27;Implementation trap&#x27;],

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);

      ids.delete(tooltipId);

    }

  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;

      return;

      middleware: [
        offset(tooltipGap),

        shift({ padding: tooltipGap }),

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

          return;

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      openTooltip(trigger);

    document.removeEventListener(&quot;focusout&quot;, handleLeave);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);

  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
